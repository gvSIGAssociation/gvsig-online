# Convención de los manuales en la carpeta docs/ de un paquete (plugins y apps de proyecto).
#
# Los manuales del core y de los plugins públicos están en la documentación central (repositorio
# gvsig_doc, gvSIG/manuales.yml, publicada en docs.gvsig-services.com). Esta carpeta se usa para los
# manuales que no deben publicarse (plugins de clientes o restringidos). gvsigol_core no trae ninguno:
# este fichero queda como referencia del formato.
#
# Convención (la misma en el core, en cada plugin y en cada app de proyecto):
#
#   <paquete>/docs/docs.yml        este fichero: qué manuales hay y quién los ve
#   <paquete>/docs/<idioma>/*.md   páginas en Markdown (es obligatorio; el resto, opcional)
#   <paquete>/docs/<idioma>/img/   capturas e imágenes de ese idioma
#   <paquete>/docs/assets/         ficheros comunes a todos los idiomas (SLD, plantillas…)
#
# - Si una página no existe en el idioma del usuario se muestra la de «es», marcada como tal.
# - El título de cada página es su primer encabezado «# ...».
# - Enlaces: relativos dentro del mismo manual (otra.md#ancla, img/x.png, ../assets/y.sld);
#   a otro manual, doc:<paquete>/<página>.md#ancla (p. ej. doc:gvsigol_plugin_viewer3d/index.md).
# - audience: public (cualquiera, también sin iniciar sesión) | user (con sesión) |
#   staff (personal y superusuarios) | superuser. Una página puede restringirse más que su manual.
# - Los textos con varios idiomas se escriben como {es: ..., en: ...}; si falta el idioma, se usa es.

manuals: []
