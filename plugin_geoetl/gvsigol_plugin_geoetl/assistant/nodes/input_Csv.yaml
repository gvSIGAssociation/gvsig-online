type: input_Csv
label: CSV
family: input
summary: Lee un fichero CSV o TXT. El esquema lo completa el usuario al aceptar el
  modal.
parameters:
- name: csv-file
  required: true
  summary: Valor file:// del fichero.
  example: file:///ruta/datos.csv
- name: separator
  choices:
  - ;
  - ','
  summary: Separador de campos. No lo supongas; se detecta del fichero. Usa el de detected de get_file_columns
    o déjalo vacío.
- name: encode
  choices:
  - UTF-8
  - WINDOWS-1252
  - ISO-8859-15
  - CP850
  summary: Codificación del fichero. No la supongas; se detecta del fichero (CP850 es la de los CSV de
    Excel/MS-DOS con Ñ). Usa la de detected de get_file_columns o déjala vacía.
- name: header
  summary: Filas que se saltan antes de la cabecera.
  default: '0'
- name: schema-option
  choices:
  - has-schema
  - no-schema
  summary: has-schema si la primera fila son los nombres de columna.
  default: has-schema
- name: reading
  choices:
  - single
  - multiple
  summary: single para un fichero; multiple para todos los de una carpeta.
  default: single
- name: move
  default: ''
- name: folder
  default: ''
ports:
- direction: output
  label: Input
connection_types: []
connection_parameter: null
sql_parameters: []
