type: input_Postgis
label: PgSQL/PostGIS
family: input
summary: Lee una tabla de una conexión PostgreSQL o PostGIS, opcionalmente filtrada con una condición WHERE. No
  admite consultas SQL completas; para transformar los datos usa transformadores (o trans_Calculator con SQL). La
  geometría llega a los nodos siguientes como wkb_geometry (campo oculto, se expone con trans_ExposeAttr), aunque en
  la tabla se llame de otra forma.
parameters:
- name: get_schema-name
  summary: Esquemas cargados en el desplegable. Lo rellena el servidor al aplicar.
- name: get_tablename
  summary: Tablas cargadas en el desplegable.
- name: db
  summary: Nombre de la conexión.
  required: true
- name: schema-name
  summary: Esquema de la tabla.
- name: tablename
  summary: Tabla que se lee.
- name: checkbox
  summary: '''true'' para filtrar la tabla con la condición de clause; vacío para leerla entera. Se ajusta solo
    según haya o no condición.'
  default: ''
- name: clause
  summary: 'Solo la condición que va detrás de WHERE, sin la palabra WHERE. Nunca un SELECT ni una consulta completa:
    se ejecuta select * from tabla WHERE <clause>.'
  example: '"pop_2008" > 1000 AND "region" = ''Norte'''
ports:
- direction: output
  label: Input
connection_types:
- PostgreSQL
- PostGIS
connection_parameter: db
sql_parameters:
- clause
