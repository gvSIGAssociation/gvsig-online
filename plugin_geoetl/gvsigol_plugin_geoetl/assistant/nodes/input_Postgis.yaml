type: input_Postgis
label: PgSQL/PostGIS
family: input
summary: Lee una tabla o una consulta de una conexión PostgreSQL o PostGIS.
parameters:
- name: get_schema-name
  summary: Esquemas cargados en el desplegable. Lo rellena el servidor al aplicar.
- name: get_tablename
  summary: Tablas cargadas en el desplegable.
- name: db
  summary: Nombre de la conexión.
  required: true
- name: schema-name
  summary: Esquema.
- name: tablename
  summary: Tabla.
- name: checkbox
  summary: Si es verdadero, se usa SQL libre en lugar de la tabla.
- name: clause
  summary: Cláusula SQL adicional (WHERE, etc.).
ports:
- direction: output
  label: Input
connection_types:
- PostgreSQL
- PostGIS
connection_parameter: db
sql_parameters:
- clause
