type: output_Postgis
label: PgSQL/PostGIS
family: output
summary: Escribe el resultado en una tabla PostgreSQL o PostGIS.
parameters:
- name: get_schema-name-option
  summary: Esquemas cargados en el desplegable.
- name: get_tablename
  summary: Tablas cargadas en el desplegable.
- name: db-option
  summary: Nombre de la conexión de destino.
  required: true
- name: schema-name-option
  required: true
  summary: Esquema de destino.
  example: ds_usuario
- name: tablename
  required: true
  summary: Tabla de destino, en minúsculas y sin espacios.
  example: cruce_zonas
- name: match
  summary: Columna que identifica las filas en UPDATE y DELETE.
  default: ''
- name: operation
  summary: CREATE falla si la tabla ya existe. DROPANDCREATE la rehace, OVERWRITE
    la vacía y carga, APPEND añade, UPDATE y DELETE usan match.
  choices:
  - CREATE
  - DROPANDCREATE
  - APPEND
  - OVERWRITE
  - UPDATE
  - DELETE
  default: CREATE
- name: order
- name: preserve-fid
- name: create-gvsigol-fields
ports:
- direction: input
  label: Output
connection_types:
- PostgreSQL
- PostGIS
connection_parameter: db-option
sql_parameters: []
