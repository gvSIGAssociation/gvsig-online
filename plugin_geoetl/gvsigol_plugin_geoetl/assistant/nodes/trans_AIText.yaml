type: trans_AIText
label: AI Text
family: transform
summary: 'Transforma texto con un modelo de lenguaje a partir de una instrucción en lenguaje natural.
  Deduce qué columnas usar, qué tarea hacer (traducir, clasificar, extraer, normalizar, resumir…) y
  sugiere los atributos nuevos. Solo para tareas de lenguaje; lo que no resuelve queda vacío.'
parameters:
- name: instruction
  required: true
  summary: 'Qué hay que hacer, en lenguaje natural (idiomas, categorías, qué extraer, cómo normalizar…).
    Puede mencionar columnas de entrada y nombres de campos nuevos.'
  example: traduce o campo nome ao inglés e ao portugués (_en e _pt)
- name: attr
  required: false
  summary: 'Columnas de entrada con el texto. Si se omite, se infieren de la instrucción y el esquema.'
  format: list
  example:
  - nome
  column: 0
- name: mode
  required: false
  summary: 'Tarea inferida o explícita: translate, classify, extract, normalize, summarize o auto.'
  choices:
  - translate
  - classify
  - extract
  - normalize
  - summarize
  - auto
  example: auto
- name: new-attrs
  required: true
  summary: 'Nombres de los atributos nuevos. Se pueden sugerir desde la instrucción (p. ej. sufijos _en, _pt).'
  format: list
  example:
  - nome_en
  - nome_pt
ports:
- direction: input
  label: Input
- direction: output
  label: Output
connection_types: []
connection_parameter: null
sql_parameters: []
