type: trans_AIText
label: AI Text
family: transform
summary: >
  Transforma texto con un modelo de lenguaje (tareas predeterminadas: translate,
  classify, extract, normalize, summarize). Si el usuario pide normalizar,
  unificar o limpiar direcciones/textos a partir de varios campos, usa este nodo
  con mode normalize (no Calculator ni CreateAttr+concat). Solo lenguaje; lo que
  no resuelva queda vacío.
parameters:
- name: instruction
  required: true
  summary: >
    Qué hay que hacer, en lenguaje natural (idiomas, categorías, qué extraer,
    cómo normalizar una dirección con calle, número, municipio, ciudad…).
  example: Normaliza la dirección para Valencia capital a partir de calle y numero
- name: attr
  required: false
  summary: Columnas de entrada con el texto. Si se omite, se infieren de la instrucción y el esquema.
  format: list
  example:
  - calle
  - numero
  column: 0
- name: mode
  required: false
  summary: >
    Tarea predeterminada: translate, classify, extract, normalize, summarize o auto.
    Si el usuario dice normalizar / unificar dirección o texto, usa normalize.
  choices:
  - translate
  - classify
  - extract
  - normalize
  - summarize
  - auto
  default: auto
  example: normalize
- name: new-attrs
  required: true
  summary: Nombres de los atributos nuevos (p. ej. direccion tras normalizar).
  format: list
  example:
  - direccion
ports:
- direction: input
  label: Input
- direction: output
  label: Output
connection_types: []
connection_parameter: null
sql_parameters: []
