type: trans_CurrentDate
label: Current Date
family: transform
summary: >
  Crea un atributo nuevo con la fecha actual (DATE) o con la fecha y hora (TIMESTAMP).
  Crea él mismo la columna: no pongas antes un trans_CreateAttr con ese nombre, fallaría
  porque la columna ya existiría.
parameters:
- name: attr
  required: true
  summary: Nombre de la columna nueva. No debe llegar ya al nodo.
  example: fecha_alta
- name: checkbox
  default: ''
  choices:
  - ''
  - 'true'
  summary: Vacío = solo fecha (DATE); true = fecha y hora (TIMESTAMP).
- name: format
  summary: No se usa al ejecutar.
ports:
- direction: input
  label: Input
- direction: output
  label: Output
connection_types: []
connection_parameter: null
sql_parameters: []
