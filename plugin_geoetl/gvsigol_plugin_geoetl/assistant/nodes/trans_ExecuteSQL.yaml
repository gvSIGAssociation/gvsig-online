type: trans_ExecuteSQL
label: Execute SQL
family: transform
summary: 'Cruce fila a fila con una tabla de otra base de datos sin leerla entera: por cada fila que llega lanza
  un SELECT contra la conexión, sustituyendo ##"campo"## por el valor de esa fila, y añade a la fila las columnas
  seleccionadas. No sirve para transformar los datos del flujo (para eso, trans_Calculator u otros
  transformadores). En edición restringida no se puede cambiar.'
parameters:
- name: get_schema-name
  summary: Esquemas cargados en el desplegable. Lo rellena el servidor al aplicar.
- name: get_tablename
  summary: Tablas cargadas en el desplegable.
- name: db
  summary: Nombre de la conexión.
  required: true
- name: schema-name
  summary: Esquema.
- name: tablename
  summary: Tabla.
- name: query
  summary: 'SELECT columnas FROM esquema.tabla WHERE campo = ##"campo_de_la_entrada"##. Las columnas seleccionadas
    se añaden a cada fila.'
  example: 'SELECT "titular", "superficie" FROM "catastro"."parcelas" WHERE "refcat" = ##"refcat"##'
ports:
- direction: input
  label: Input
- direction: output
  label: Output
connection_types: []
connection_parameter: db
sql_parameters:
- query
