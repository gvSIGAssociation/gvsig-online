type: trans_RenameAttr
label: Rename Attribute
family: transform
summary: Renombra un atributo.
parameters:
- name: old-attr
  required: true
  summary: Columnas que se renombran.
  format: list
  example:
  - nom
  - cod
  column: 0
- name: new-attr
  required: true
  summary: Nombres nuevos separados por espacio, en el mismo orden que old-attr.
  format: spaced
  example: nombre codigo
ports:
- direction: input
  label: Input
- direction: output
  label: Output
connection_types: []
connection_parameter: null
sql_parameters: []
