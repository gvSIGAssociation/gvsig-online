type: trans_Stats
label: Statistics
family: transform
summary: Calcula estadísticas de un atributo, opcionalmente por grupos. Solo devuelve la columna de agrupación y
  _max, _min, _count, _sum, _mean, _median, _mode y _desv; la columna original (attr) ya no sale, así que los nodos
  siguientes deben usar _sum, _mean, etc.
parameters:
- name: attr
  required: true
  summary: Columna numérica o de fecha sobre la que se calculan las estadísticas.
  column: 0
  example: poblacion
- name: group-by-attr
  summary: Columna por la que se agrupa, o - para no agrupar.
  default: '-'
  column: 0
ports:
- direction: input
  label: Input
- direction: output
  label: Output
connection_types: []
connection_parameter: null
sql_parameters: []
